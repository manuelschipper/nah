[workspace]
resolver = "3"
members = [
    "crates/nah-proto",
    "crates/nah-observe",
    "crates/nah-policy",
    "crates/nah-extensions",
    "crates/nah-effinterp",
    "crates/nah-cli",
    "crates/nah-corpus",
    "crates/nah-corpus-schema",
    "tools/gates",
    "crates/effinterp-proto",
    "crates/effinterp-model-schema",
    "crates/effinterp-engine",
    "crates/effinterp-repo",
    "crates/effinterp-conformance",
    "crates/effinterp-bench",
    "crates/effinterp-model-factory",
    "crates/effinterp-trace",
    "crates/effinterp-matcher",
    "crates/effinterp-testkit",
]
exclude = [
    "third_party/gosyn",
    "homepage/wasm",
    "tools/gates/fixtures/impure-alias",
]

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep dev and test identical so `cargo build`, `cargo run`, and `cargo test`
# share one artifact set, and keep debuginfo off so linked test binaries stay
# small. Do not override these through CARGO_PROFILE_* or CARGO_INCREMENTAL
# environment variables: each distinct value makes Cargo build a full second
# copy of the workspace under the same target directory.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# The engine's Go frontend uses the vendored parser fork, not the registry copy.
[patch.crates-io]
gosyn = { path = "third_party/gosyn" }
