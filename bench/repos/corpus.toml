# effinterp bench, Plane B: 100 pinned public repositories (see bench design brief).
#
# era rule (verbatim): post-ai = created 2024-01 or later, OR the repo is an
# agent runtime / agent tooling (coding agents, MCP servers, agent skills,
# harnesses) regardless of date; pre-ai = everything else (the classic set is
# created <= 2022).
#
# Sets: v1, holdout and semantic-depth rows keep the SHAs, splits and
# expectation files of their retired source manifests (the v1 stress corpus,
# the holdout manifest, the semantic-depth manifest). composer/composer,
# junegunn/fzf and sharkdp/bat appear in both holdout and semantic-depth; the
# holdout row and its expectation file are kept.
# field-trial-1 rows (the 2026-08-31 repository report, no SHAs recorded)
# and every set = "new" row were pinned with `git ls-remote <url> HEAD` on
# 2026-09-10. field-trial-3/4 SHAs come from their field-trial records.
#
# Hidden split for set = "new": per language, sort the new names, shuffle with
# Python random.Random(20260910), mark the first round(n/3) hidden. Hidden
# rows are never analyzed until a declared evaluation. The holdout set's own
# hidden split was opened on 2026-08-19 (stress runs p12-p16, phase
# post-hidden/tuned), so every holdout row is dev here.
#
# created, license and primary language come from the GitHub repos API on
# 2026-09-10. vendorable = license in {MIT, Apache-2.0, BSD-2/3, ISC,
# PostgreSQL, CC0, Unlicense, MPL-2.0}.

corpus = "bench"
version = 1
pinned = "2026-09-10"

