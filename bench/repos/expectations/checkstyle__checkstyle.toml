version = 2

[should_find]
op=filesystem.read

# Fact-level assertions.
[facts]
op=filesystem.read origin=checkstyle/Main.java realm=host modality=may
op=filesystem.write origin=checkstyle/Main.java realm=host modality=may

[forbidden]
op=database.
op=cloud.
op=messaging.
op=process.exec
op=git.

[known_hard]
# The Checker root module is instantiated reflectively
# (PackageObjectFactory.createModule), so per-file reads and the cache write
# sit behind reflection dispatch.
op=filesystem.read origin=api/FileText.java
op=filesystem.write origin=checkstyle/PropertyCacheFile.java
