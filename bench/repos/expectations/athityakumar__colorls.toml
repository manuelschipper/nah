# anywhere in lib/ or exe/ (checked by sweep); the git subprocess is read-only
# (rev-parse/status).
#
# Matcher syntax: one per line, `key=value` tokens — op (operation prefix,
# required), res (resource substring), origin (origin-file substring),
# realm (exact), modality (exact).

version = 2

[should_find]
op=filesystem.read

# Fact-level assertions.
[facts]
op=filesystem.read origin=lib/colorls/yaml.rb realm=host
op=filesystem. origin=lib/colorls/core.rb realm=host
op=process.exec res=git origin=lib/colorls/git.rb realm=host modality=may

[forbidden]
