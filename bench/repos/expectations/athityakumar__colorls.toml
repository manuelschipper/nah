# Ground-truth expectations for athityakumar/colorls (holdout-dev corpus).
# Pinned SHA: ec2fbcd36f6b7fa56c72b13e52c235eba277bad0.
# Real entry: exe/colorls (gem executable; requires colorls then
#   `exit ColorLS::Flags.new(*ARGV).process`, exe/colorls:26 — the Ruby
#   cli-gem shape).
# Derived from:
#   lib/colorls/yaml.rb (bundled + user YAML config read File.read(filepath),
#     yaml.rb:23, with the user override under ~/.config/colorls, yaml.rb:7/12),
#   lib/colorls/core.rb (directory listing Dir.entries, core.rb:71/463),
