version = 2

[should_find]
op=environment.read

# Fact-level assertions (the pre-dispatch version-check chain).
[facts]
op=environment.read res=JBANG_NO_VERSION_CHECK origin=util/VersionChecker.java realm=host
op=environment.read res=JBANG_DIR origin=dev/jbang/Settings.java realm=host
op=environment.read res=JBANG_CACHE_DIR origin=dev/jbang/Settings.java realm=host
op=filesystem.write res=version.txt origin=util/VersionChecker.java realm=host modality=may
op=filesystem.read origin=util/VersionChecker.java realm=host modality=may
op=network. origin=util/NetUtil.java realm=host modality=may

[forbidden]
op=database.
op=cloud.
op=messaging.
op=git.history_rewrite

[known_hard]
# Subcommand bodies dispatch through the aesh command tree (JBang.class) and
# build-step/base-class hierarchies: java/compiler/editor spawns and cache
