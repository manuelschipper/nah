#   MavenWrapperMain.java (public static void main, MavenWrapperMain.java:59;
#   the mvnw/mvnw.cmd scripts under maven-wrapper-distribution/src/resources
#   are the shell half of the mixed-language shape and launch this main).
# Derived from (all under maven-wrapper/src/main/java/org/apache/maven/wrapper):
#   MavenWrapperMain.java (System.getenv(MAVEN_USER_HOME_ENV_KEY),
#     MavenWrapperMain.java:141),
#   WrapperExecutor.java (maven-wrapper.properties read via
#     Files.newInputStream + properties.load, WrapperExecutor.java:135-136;
#     getEnv -> System.getenv, :98, for MVNW_REPOURL, :110),
#   DefaultDownloader.java (System.getenv(MVNW_USERNAME)/(MVNW_PASSWORD) for
