op=filesystem.write origin=pkg/yqlib/printer_writer.go realm=host modality=may

[forbidden]
# yq is a pure data-file processor: no network I/O anywhere in product code.
op=network.
op=database.
op=cloud.
op=messaging.
op=git.

[known_hard]
# env()/strenv() and system() dispatch through the expression operator table.
op=environment.read origin=pkg/yqlib/operator_env.go
