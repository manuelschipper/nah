version = 2

[should_find]
op=filesystem.read

# Fact-level assertions (all behind the cobra RunE wall; see header).
[facts]
op=environment.read res=NO_COLOR origin=cmd/root.go realm=host
op=filesystem.read origin=cmd/utils.go realm=host modality=may
op=filesystem.read origin=pkg/yqlib/utils.go realm=host
