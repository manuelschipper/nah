name: parser-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Differential parser fuzz
        env:
          NAH_FUZZ_CASES: "4096"
        run: |
          selected="$(cargo test -p nah-parse --test parser a_clean_parser_result_is_accepted_by_bash --locked -- --list)"
          case "$selected" in
            *"a_clean_parser_result_is_accepted_by_bash: test"*) ;;
            *) echo "differential parser fuzz test was not selected" >&2; exit 1 ;;
          esac
          cargo test -p nah-parse --test parser a_clean_parser_result_is_accepted_by_bash --locked
      - name: Python and Node semantic oracle
        run: |
          command -v python3
          command -v node
          selected="$(cargo test -p nah-inline --test runtime_oracle supported_subset_matches_cpython_and_node --locked -- --ignored --list)"
          case "$selected" in
            *"supported_subset_matches_cpython_and_node: test"*) ;;
            *) echo "language semantic oracle was not selected" >&2; exit 1 ;;
          esac
          cargo test -p nah-inline --test runtime_oracle supported_subset_matches_cpython_and_node --locked -- --ignored
