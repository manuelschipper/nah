name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path spikes/p2-tree-sitter/Cargo.toml --all --check
          cargo fmt --manifest-path tools/gates/fixtures/impure-alias/Cargo.toml --check
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path spikes/p2-tree-sitter/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Test (includes purity, dependency-direction, and corpus gates)
        run: |
          cargo test --workspace --locked
          cargo test --manifest-path spikes/p2-tree-sitter/Cargo.toml --workspace --locked
      - name: Release KPIs and benches compile
        run: |
          cargo test --release -p nah-cli --test latency captured_walking_skeleton_p99_is_below_one_millisecond --locked -- --ignored --test-threads=1
          cargo test --release -p nah-cli --test latency captured_bash_spine_p99_is_below_one_millisecond --locked -- --ignored --test-threads=1
          cargo test --release -p nah-cli --test latency captured_ambient_preflight_p99_is_below_one_millisecond --locked -- --ignored --nocapture --test-threads=1
          cargo test --release -p nah-cli --test latency captured_inline_signature_p99_is_below_one_millisecond --locked -- --ignored --test-threads=1
          cargo test --release -p nah-policy --test reducer captured_policy_p99_is_below_one_millisecond --locked -- --ignored --test-threads=1
          cargo test --release -p nah-parse --test fork_bomb a_large_visible_function_graph_is_scanned_inside_its_documented_bound --locked -- --ignored --test-threads=1
          cargo test --release -p nah-parse a_long_pipeline_is_scanned_inside_its_documented_bound --locked -- --ignored --nocapture --test-threads=1
          cargo test --release -p nah-cli --lib pipeline::performance_tests::performance_kpis --locked -- --ignored --nocapture --test-threads=1
          cargo bench --workspace --no-run --locked
          cargo bench --manifest-path spikes/p2-tree-sitter/Cargo.toml --workspace --no-run --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Compile
        run: cargo build --workspace --all-targets --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test portable Windows semantics
        run: cargo test -p nah-proto -p nah-inline -p nah-actions -p nah-policy --locked --no-fail-fast
      - name: Test native Windows state and extensions
        run: cargo test -p nah-observe -p nah-extensions --locked --no-fail-fast
      - name: Test native Windows CLI core
        run: cargo test -p nah-cli --lib --locked --no-fail-fast
      - name: Test native Windows runtime integrations
        run: >
          cargo test -p nah-cli --locked --no-fail-fast
          --test audit
          --test catalog
          --test claude_adapter
          --test claude_installation
          --test cline_adapter
          --test cline_installation
          --test codex_installation
          --test copilot_adapter
          --test copilot_installation
          --test cursor_installation
          --test degraded_state
          --test host_integrity
          --test kiro_adapter
          --test kiro_installation
          --test live_state
          --test nap
          --test self_protection
          --test trust
          --test windows_extensions
          --test windows_unresolved_filesystem
          --test windows_unsupported_installation
      - name: Build release artifact
        run: cargo build --release --locked -p nah-cli
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.5.0
      - name: Test installer and packaged product
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item target/release/nah.exe pkg/nah.exe
          Copy-Item LICENSE pkg/LICENSE
          Compress-Archive -Path pkg/nah.exe,pkg/LICENSE `
            -DestinationPath nah-x86_64-pc-windows-msvc.zip
          $hash = (Get-FileHash nah-x86_64-pc-windows-msvc.zip `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$PWD/sha256sums.txt",
            "$hash  nah-x86_64-pc-windows-msvc.zip`n")
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $expectedVersion = ($metadata.packages |
            Where-Object name -eq 'nah-cli').version
          $container = New-PesterContainer -Path homepage/install.Tests.ps1 -Data @{
            ArtifactPath = "$PWD/nah-x86_64-pc-windows-msvc.zip"
            ChecksumsPath = "$PWD/sha256sums.txt"
            ExpectedVersion = $expectedVersion
          }
          $result = Invoke-Pester -Container $container -CI -PassThru
          if ($result.FailedCount -ne 0) { exit 1 }

  # Windows has its own native job above; this matrix covers the remaining
  # supported release platform.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          components: clippy
      - name: Cross-platform native pipeline
        run: cargo test -p nah-inline -p nah-actions -p nah-observe -p nah-extensions -p nah-cli --locked
      - name: Cross-platform lint
        run: cargo clippy -p nah-inline -p nah-actions -p nah-observe -p nah-extensions -p nah-cli --all-targets --locked -- -D warnings
