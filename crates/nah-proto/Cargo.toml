[package]
name = "nah-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
effinterp-proto = { git = "https://github.com/manuelschipper/effectinterp.git", rev = "41f707b9b127e2d974368f99e4c17891b06d8920", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
effinterp = ["dep:effinterp-proto"]

[dev-dependencies]
proptest = "1"
trybuild = "1"
