[package]
name = "nah-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
effinterp-proto = { git = "https://github.com/manuelschipper/effectinterp.git", rev = "80ad17d8f48828565369c92a372b321c6124fc11", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
effinterp = ["dep:effinterp-proto"]

[dev-dependencies]
proptest = "1"
trybuild = "1"
