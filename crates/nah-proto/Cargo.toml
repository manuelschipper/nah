[package]
name = "nah-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
effinterp-proto = { git = "https://github.com/manuelschipper/effectinterp.git", rev = "c6a8d6122a6f0817b927068c0bc08e5434f59370", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
effinterp = ["dep:effinterp-proto"]

[dev-dependencies]
proptest = "1"
trybuild = "1"
