summary = "Blocks editing or deleting Git's internal data under `.git` directly: its objects, refs, logs, packed refs, and worktrees."

replaces = ["git-metadata"]

description = '''
This rule stops the agent from editing or deleting the Git object database
and ref store directly. Doing so can corrupt the repository beyond repair, or
delete history that no Git command would remove. It blocks writes, deletes,
moves, and permission changes that reach the `.git` directory itself or its
`objects`, `refs`, `logs`, `packed-refs`, or `worktrees` entries. A recursive
delete of any `*.git` directory, and the same entries under a repository's
separate Git directory, count too. A permission change that keeps the owner's
access, such as `chmod 644` on files or `chmod -R u+w`, destroys nothing and
delegates.
'''

limits = '''
Nah cannot resolve a path written by a program whose behavior it does not
trust, or a move whose destination it cannot follow. Those calls delegate with
a coverage gap.
'''

applies_at = '''
It applies at core because direct damage to Git's internals bypasses every
Git safety net, and Git commands exist for every legitimate change.
`work/history-rewrite` covers Git's own reflog expiry and prune commands,
`work/files-delete` covers deleting the whole checkout, and
`persistence/git-hook-write` covers the hooks and settings under `.git`.
'''

[[blocks]]
row = "git-metadata.root"
why = "rm -rf .git deletes the repository's entire history."
tui = true

[[blocks]]
row = "git-metadata.write-objects"
why = "The redirect overwrites a file in the object store."
tui = true

[[blocks]]
row = "git-metadata.live-cp-replacement-git-refs-heads-main"
why = "cp overwrites the ref file that records main's commit."
tui = true

[[blocks]]
row = "git-metadata.refs"
why = "Deleting .git/refs removes every branch and tag pointer."

[[blocks]]
row = "git-metadata.truncate-packed-refs"
why = "truncate empties packed-refs, losing the refs stored there."

[[blocks]]
row = "git-metadata.move-git-dir"
why = "Moving .git away detaches the checkout from its history."

[[blocks]]
row = "git-metadata.bare-objects"
why = "backup.git/objects is the object store of a bare repository."

[[blocks]]
row = "git-metadata.find-files-chmod-000-blocks"
why = "Mode 000 makes every object and ref file unreadable, even for its owner."

[[passes]]
row = "git-metadata.find-files-chmod-644-delegates"
why = "Mode 644 keeps every file under .git readable and writable by its owner."
cause = "out-of-scope"

[[passes]]
row = "git-metadata.index-delegates"
why = "The index is rebuilt from HEAD; it is not durable history."
cause = "out-of-scope"

[[passes]]
row = "git-metadata.hook-delegates"
why = "Hooks are local scripts, not history."
cause = "out-of-scope"

[[passes]]
row = "git-metadata.index-lock-delegates"
why = "index.lock is a stale lock file, not history."
cause = "out-of-scope"

[[passes]]
row = "git-metadata.rebase-merge-delegates"
why = "rebase-merge holds transient rebase state."
cause = "out-of-scope"

[[passes]]
row = "git-metadata.update-ref-delegates"
why = "update-ref changes refs through Git's own checked interface."
cause = "out-of-scope"

[[passes]]
row = "git-metadata.tar-backup-delegates"
why = "tar only reads .git to build an archive."
cause = "out-of-scope"
