cause = "out-of-scope"

[[passes]]
row = "fs-home.symlink-no-slash-rm-delegates"
why = "Without a trailing slash, rm removes the link, not the home it points to."
cause = "out-of-scope"

[[passes]]
row = "compound.pwsh-inline-whatif-home-boundary"
why = "-WhatIf only reports what Remove-Item would delete."
cause = "out-of-scope"

[[passes]]
row = "fs-home.physical-cd-unobserved-pwd-var-delegates"
why = "Nah cannot observe where unobserved-dir leads, so $PWD is unknown."
cause = "unresolved"

[[passes]]
