summary = "Blocks deletion, recursive permission changes, or overwriting every file, selecting the home root or a personal folder such as `~/Documents`."
nap_only = true

description = '''
This guard stops a command that would wipe or lock the whole home directory,
destroying dotfiles, keys, unpushed work in other projects, and everything
else under `~`. It blocks a recursive delete, or a recursive `chmod`, `chown`,
or `chgrp`, that selects the home directory itself. A pattern that selects
every entry of home, such as `~/{*,.*}`, counts too, and so does emptying or
overwriting every file below it, as `find ~ -type f -exec shred {} +` does.

The personal folders directly under home, `Desktop`, `Documents`, `Pictures`,
`Movies`, `Videos`, and `Music`, are protected the same way; `Downloads` is not.
'''

limits = '''
Nah decides from the paths it observes and the command's spelling. A target it
cannot identify delegates, and so does a program whose filesystem behavior Nah
does not trust, such as a lookalike binary outside a system bin directory.
Only the default folder names count, not localized or redirected ones.
'''

default_reason = '''
It ships on because wiping home or a personal folder is broad loss with no
routine use. `fs-system-tree` and `fs-project-root` give the same
protection to the filesystem root and the project root,
`fs-outside-workspace-delete` covers subtrees, and `fs-auth-identity`,
`fs-startup-persistence`, and `secrets-credentials` protect specific files
under home.
'''

[[blocks]]
row = "fs-home.rm-home"
why = "rm -rf ~ deletes the home directory itself."
tui = true

[[blocks]]
row = "fs-home.filesystem-cd-rm-rf"
why = "After cd ~, the . operand is the home root."
tui = true

[[blocks]]
row = "fs-home.find-implicit-recursive-chown"
why = "find ~ hands every entry under home to chown, a recursive ownership change."
tui = true

[[blocks]]
row = "fs-home.rm-documents-folder"
why = "~/Documents is a standard personal folder directly under home."
tui = true

[[blocks]]
row = "fs-home.macos-mv-desktop-away"
why = "Moving ~/Desktop takes the whole folder off its path."

[[blocks]]
row = "fs-home.rm-home-brace-glob"
why = "~/{*,.*} selects every entry in home, hidden ones included."

[[blocks]]
row = "fs-home.zip-move-home"
why = "zip -m deletes the home tree after archiving it."

[[blocks]]
row = "compound.python-rmtree-path-home"
why = "shutil.rmtree is given Path.home(), the home root."

[[blocks]]
row = "windows.pwsh.home-variable"
why = "Remove-Item -Recurse is given $HOME."

[[passes]]
row = "fs-home.factory-cache-subtree-delegates"
why = "~/.cache/pip is a subtree of home, not the home root."
cause = "out-of-scope"

[[passes]]
row = "fs-home.rm-downloads-folder-delegates"
why = "Clearing Downloads is routine."
cause = "out-of-scope"

[[passes]]
row = "fs-home.documents-subtree-delegates"
why = "A subtree inside the folder, not the folder."
cause = "out-of-scope"

[[passes]]
row = "fs-home.home-suffix-glob-delegates"
why = "~/*.log selects only .log files, not every home entry."
cause = "out-of-scope"

[[passes]]
