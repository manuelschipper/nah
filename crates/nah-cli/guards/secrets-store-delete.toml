summary = "Blocks remaining reviewed secret-store deletion: Vault kv delete, AWS Secrets Manager ordinary or recovery-window deletion, Azure Key Vault object and vault delete, Google secret version destruction, Doppler secret deletion, Infisical secret/folder deletion, and 1Password item/document deletion. Recovery may depend on remote configuration. Archive, help, non-executing forms, dynamic targets, and unknown syntax stay outside."

description = '''
This guard stops deletion from a secret manager when the secret can still be
recovered, or when recovery depends on remote settings. It covers Vault
`kv delete`, AWS Secrets Manager deletion with a recovery window, Azure Key
Vault object and vault deletion, Google secret version destruction, Doppler
secret deletion, Infisical secret and folder deletion, and 1Password item and
document deletion. Archiving, `run` and `inject` workflows, help, and
unresolved targets stay outside.
'''

limits = '''
Nah cannot see the remote recovery window or soft-delete setting. A request
whose deletion mode Nah cannot tell delegates with a coverage gap.
'''

default_reason = '''
It ships off because deleting a secret that can be recovered is routine
rotation work. It is independent of the default-on `secrets-store-destroy`,
which covers permanent destruction, so changing one does not change the
other.
'''

[[blocks]]
row = "secrets-store-delete.vault-soft-delete"
why = "kv delete removes the latest version of service/api; it stays undeletable only until destroyed."
tui = true

[[blocks]]
row = "secrets-store-delete.aws-recovery-window"
why = "The secret is scheduled for deletion and is gone after the 14-day window."
tui = true

[[blocks]]
row = "secrets-store-delete.op-item-delete-item-id-vault-prod"
why = "Without --archive, op item delete removes the item from the prod vault."
tui = true

[[blocks]]
row = "secrets-store-delete.az-keyvault-secret-delete-vault-name-prod-name-service-api"
why = "Recovery depends on the vault's soft-delete setting, which Nah cannot see."

[[blocks]]
row = "secrets-store-delete.doppler-secrets-delete-api-token-database-url-project-service-config"
why = "Both named secrets are deleted from the prod configuration."

[[passes]]
row = "secrets-store-delete.onepassword-archive-delegates"
why = "--archive moves the item to the archive, where it can be restored."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.gcloud-version-disable-delegates"
why = "Disabling a version keeps its value and can be undone."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.aws-restore-secret-delegates"
why = "restore-secret cancels a scheduled deletion."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.vault-delete-help-delegates"
why = "-help prints usage and deletes nothing."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.aws-describe-delegates"
why = "describe-secret reads metadata only."
cause = "out-of-scope"
