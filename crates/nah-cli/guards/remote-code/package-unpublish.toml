summary = "Blocks unpublishing a package, irreversible RubyGems yanks, and changing who owns a published package name."

replaces = ["registry-publish", "registry-unpublish"]

strict_adds = "At strict, it also blocks publishing a package, directly or through a release tool."

description = '''
This rule stops the agent from removing a published package, irreversibly
yanking a RubyGems version, or changing who owns a published package name.
Those actions break every downstream user or hand the name to someone else. It
blocks unpublish and RubyGems yank, and the npm, pnpm, Yarn Classic, Cargo,
and RubyGems owner commands that add or remove an owner. A reversible Cargo
yank, npm deprecation, listing and other administration, NuGet deletion,
restorable GitHub Packages deletion, and installing or removing dependencies
stay outside, except for lifecycle scripts Nah follows into them.

At strict, it also stops publishing a package to a registry. A release that
reaches users cannot be cleanly taken back and may carry unreviewed code or
secrets. It blocks the publish commands of npm, pnpm, Cargo, Python
uploaders, and NuGet, and release tools that publish for you (Lerna,
Changesets, semantic-release, np, release-it, PDM, Rye, maturin,
cargo-release, cargo-workspaces), when they would actually publish. Dry runs
of npm, pnpm, Cargo, Poetry, and Flit stay outside.
'''

limits = '''
Nah cannot tell whether an owner change is a planned handover, or whether the
version, package, and registry are the intended release. A release tool's
packages and registry come from project configuration it does not read.
Web-only PyPI and pub.dev operations are outside its reach. Maven and Gradle
publishing do not show the target repository, and Hex, Dart, Deno,
container, and chart publishing are not modeled.
'''

applies_at = '''
Unpublishing and owner changes apply at core because losing a package or its
name is hard or impossible to reverse, and these commands are rare in normal
work. Publishing applies only at strict because it is the routine end of a
release the user usually asked for.
'''

[[blocks]]
row = "registry-unpublish.gem-yank"
why = "A RubyGems yank cannot be undone, and the version number cannot be reused."
tui = true

[[blocks]]
row = "registry-unpublish.npm-owner-remove"
why = "owner rm takes publish rights to left-pad away from mallory."
tui = true

[[blocks]]
row = "registry-unpublish.npm-package-version"
why = "npm unpublish removes left-pad@1.3.0 from the registry for every downstream user."

[[blocks]]
row = "registry-unpublish.npm-owner-add"
why = "owner add hands publish rights to left-pad to alice."

[[blocks]]
row = "registry-unpublish.cargo-owner-add"
why = "cargo owner --add gives alice ownership of the crate name."

[[blocks]]
row = "registry-publish.npm"
why = "npm publish uploads the current package to the npm registry."
tui = true
strict = true

[[blocks]]
row = "registry-publish.cargo"
why = "cargo publish uploads the crate to crates.io, where versions are permanent."
tui = true
strict = true

[[blocks]]
row = "registry-publish.twine"
why = "twine upload sends every built distribution in dist/ to PyPI."
tui = true
strict = true

[[blocks]]
row = "registry-publish.npm-negated-dry-run"
why = "--no-dry-run turns the dry run off, so the package is published."
strict = true

[[blocks]]
row = "registry-publish.dotnet-nuget"
why = "dotnet nuget push uploads the package to nuget.org."
strict = true

[[passes]]
row = "registry-boundary.cargo-yank-delegates"
why = "A Cargo yank is reversible with cargo yank --undo."
cause = "out-of-scope"

[[passes]]
row = "registry-boundary.npm-deprecate-delegates"
why = "npm deprecate only attaches a warning; the version stays installable."
cause = "out-of-scope"

[[passes]]
row = "registry-boundary.npm-owner-list-delegates"
why = "owner ls only lists the current owners."
cause = "out-of-scope"

[[passes]]
row = "registry-unpublish.npm-dry-run"
why = "--dry-run reports what would be removed without removing it."
cause = "out-of-scope"

[[passes]]
row = "registry-boundary.dotnet-delete-delegates"
why = "Whether nuget delete unlists or removes depends on the target feed."
cause = "out-of-scope"

[[passes]]
row = "registry-publish.npm-dry-run-delegates"
why = "--dry-run packs and reports without uploading."
cause = "out-of-scope"

[[passes]]
row = "registry-publish.cargo-dry-run-delegates"
why = "--dry-run verifies the crate without uploading it."
cause = "out-of-scope"

[[passes]]
row = "registry-publish.cargo-release-default-dry-run-delegates"
why = "cargo release only rehearses unless --execute is given."
cause = "out-of-scope"

[[passes]]
row = "registry-boundary.npm-pack-delegates"
why = "npm pack writes a local tarball and uploads nothing."
cause = "out-of-scope"

[[passes]]
row = "registry-publish.python-build-delegates"
why = "python -m build only produces local distributions."
cause = "out-of-scope"
