summary = "Blocks deleting a whole hosted repository on GitHub, GitLab, or Azure DevOps."

replaces = ["git-ref-delete", "git-remote-repo-delete"]

strict_adds = "At strict, it also blocks pushes that delete or prune remote branches and tags."

description = '''
This rule stops the agent from deleting an entire hosted GitHub, GitLab, or
Azure DevOps repository, with its issues, pull requests, releases, and
settings. It blocks `gh repo delete`, `glab repo delete`,
`glab project delete`, `az repos delete`, and `az devops project delete`, and
`DELETE` requests to a repository route through `gh api`, `glab api`, or a
generic HTTP client such as `curl`. A repository named in a variable still
blocks, because the action is certainly whole-repository deletion.

At strict, it also blocks pushes that delete a remote branch or tag
(`:ref`, `--delete`) or prune remote refs (`--prune`, `--mirror`). Deleting a
release, secret, or webhook is `remote-code/hosted-resource-delete`.
'''

limits = '''
Nah cannot see account permissions, whether backups exist, or whether a
remote branch is still in use. In a few cases `gh` would reject the
invocation before sending anything, yet Nah currently blocks it. A request
whose target kind is unknown delegates with a coverage gap.
'''

applies_at = '''
Whole-repository deletion applies at core because it loses collaboration
history a local clone does not hold. Deleting or pruning remote refs applies
only at strict because deleting merged branches is routine maintenance.
Releases, secrets, and webhooks are `remote-code/hosted-resource-delete`, so
pruning a release does not also allow deleting the repository.
`work/branch-delete` covers local branches, `remote-code/force-push` covers
deleting the default branch, and `infrastructure/vault-secret-delete` covers
secret managers outside GitHub and GitLab.
'''

[[blocks]]
row = "git-ref-delete.push-delete-refspec"
why = "An empty source in :old deletes the remote branch old."
tui = true
strict = true

[[blocks]]
row = "git-ref-delete.gh-api-delete-ref"
why = "The DELETE request removes the branch ref on GitHub."
strict = true

[[blocks]]
row = "git-remote-repo-delete.gh-explicit-confirmed"
why = "gh repo delete removes the hosted repository; --yes skips the prompt."
tui = true

[[blocks]]
row = "git-remote-repo-delete.live-glab-repo-delete-group-project-y"
why = "glab repo delete removes the GitLab project."
tui = true

[[blocks]]
row = "git-remote-repo-delete.gh-api-placeholders"
why = "DELETE on repos/{owner}/{repo} is the repository deletion route."
tui = true

[[blocks]]
row = "git-remote-repo-delete.gh-current"
why = "With no argument, gh deletes the current repository."

[[blocks]]
row = "git-remote-repo-delete.glab-api-id"
why = "DELETE on projects/123 deletes the GitLab project by id."

[[blocks]]
row = "git-remote-repo-delete.generic-http-delegates"
why = "curl sends DELETE to the repository's GitHub API URL."

[[blocks]]
row = "git-remote-repo-delete.az-devops-project-factory"
why = "Deleting the team project deletes every repository in it."

[[blocks]]
row = "git-remote-repo-delete.dynamic-target-delegates"
why = "Whatever $REPOSITORY names, the command deletes a whole repository."

[[passes]]
row = "git-remote-repo-delete.gh-nested-endpoint-delegates"
why = "The route ends in /issues, a resource inside the repository."
cause = "out-of-scope"

[[passes]]
row = "git-remote-repo-delete.other-method-delegates"
why = "The later --method GET overrides DELETE."
cause = "out-of-scope"

[[passes]]
row = "git-remote-repo-delete.archive-delegates"
why = "archive makes the repository read-only but keeps it."
cause = "out-of-scope"

[[passes]]
row = "git-remote-repo-delete.glab-unencoded-path-delegates"
why = "An unencoded group/project path is not GitLab's project route."
cause = "out-of-scope"

[[passes]]
row = "git-remote-repo-delete.gh-slurp-delegates"
why = "gh rejects --slurp without --paginate before sending anything."
cause = "out-of-scope"

[[passes]]
row = "git-remote-repo-delete.gh-dynamic-api-option-delegates"
why = "* expands to file names at run time, so Nah cannot tell how gh parses the call."
cause = "unresolved"
