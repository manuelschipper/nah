summary = "Blocks reads of .env files and sensitive basenames, plus direct output of catalogued credential environment variables."

description = '''
This guard stops the agent from reading `.env`-style credential files, or
printing credential environment variables, into its context. It blocks
reading `.env` and `.env.*` files other than `.example`, `.sample`,
`.template`, and `.dist`, plus `.pypirc`, `.pgpass`, and `.boto`, including
from Git history. It also blocks printing well-known credential variables
such as `ANTHROPIC_API_KEY`, `AWS_SECRET_ACCESS_KEY`, `GITHUB_TOKEN`, and
`DATABASE_URL`. Writing and templating `.env` files, including a native
`Write`, stays outside. So does a copy that keeps a `.env` name
(`cp .env .env.bak`, `cp -r . ../copy`) and a plain `cat .env | wc -l`.
'''

limits = '''
Nah cannot know which unusual variable names hold secrets, and it reads only
the environment it observes. Printing a credential variable, or a bare
`printenv` or `env`, blocks only when that environment holds a listed
credential such as `GITHUB_TOKEN`. As a known limitation, `sort
--random-source .env` currently delegates.

`grep -r PATTERN .` blocks in a tree that holds `.env`, since matching
lines carry values; `rg PATTERN`, a narrower path, or `--exclude=.env` pass.
`source .env && npm start` passes; a later `$NAME` of a variable it set
blocks, as does a later `env` or `ls`. Archives of such a tree, copies
under another name (`cp .env /tmp/x`), and filters that print only names or counts
(`cut -d= -f1 .env`) block too; a count passes only as plain `cat` into
`wc` with counting options. A glob over a `cp -r` copy blocks.
'''

default_reason = '''
It ships on because reading secrets into an agent transcript is exposure even
without exfiltration. `secrets-credentials` covers key and credential-store
files, `secrets-exfil` covers sending these values over the network, and
`secrets-store-read` covers secret-manager values.
'''

[[blocks]]
row = "secrets-env.env-read"
why = "cat prints the .env file, which holds the project's secrets."
tui = true

[[blocks]]
row = "local-utilities.date-file-secret"
why = "date --file reads .env line by line and echoes lines it cannot parse."
tui = true

[[blocks]]
row = "secrets-env.live-tar-cf-out-tar-files-from-env"
why = "--files-from reads .env and reports its lines as missing file names."
tui = true

[[blocks]]
row = "secrets-env.named-printenv"
why = "printenv prints the value of AWS_SECRET_ACCESS_KEY."
tui = true

[[blocks]]
row = "secrets-env.credential-expansion"
why = "The shell expands $GITHUB_TOKEN into echo's output."
tui = true

[[blocks]]
row = "secrets.bare-printenv-delegates"
why = "The observed environment holds a credential, so bare printenv prints it."

[[blocks]]
row = "secrets-env.git-show"
why = "The .env file is read out of a commit instead of the working tree."

[[passes]]
row = "exec.environment-disclosure-alone-delegates"
why = "The observed environment holds no listed credential, so printenv discloses none."
cause = "out-of-scope"

[[passes]]
row = "secrets-env.append-delegates"
why = "Appending writes to .env without reading it."
cause = "out-of-scope"

[[passes]]
row = "secrets-env.template-copy-delegates"
why = ".env.example is a template; the copy reads no secret."
cause = "out-of-scope"

[[passes]]
row = "secrets-env.copy-keeps-labeled-name-delegates"
why = "The copy keeps a .env name and prints nothing; reading it later still blocks."
cause = "out-of-scope"

[[passes]]
row = "secrets-env.cat-env-piped-to-line-count-delegates"
why = "wc prints only the line count of what cat hands it."
cause = "out-of-scope"

[[passes]]
row = "secrets-env.permission-write"
why = "chmod changes .env's mode without reading it."
cause = "out-of-scope"

[[passes]]
row = "secrets-env.terraform-read"
why = "terraform.tfvars is not a listed credential file."
cause = "out-of-scope"
