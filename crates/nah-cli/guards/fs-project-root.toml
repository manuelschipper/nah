summary = "Blocks recursive deletion, recursive permission changes that can lock the owner out, or overwriting every file, selecting the exact project root or its `*`, `.*`, or `{*,.*}` root-wide patterns. `find -delete` without an explicit start path has no modeled target."

description = '''
This guard prevents a command that wipes or locks the whole project checkout
at once, taking uncommitted work with it. It blocks a recursive delete, or a
recursive `chmod`, `chown`, or `chgrp`, that selects the project root itself or
every entry in it through `*`, `.*`, or `{*,.*}`. Emptying or overwriting
every file below the root, as `find . -type f -exec shred {} +` does, loses
the same work and blocks too. A permission change that cannot lock the owner
out delegates: a `chmod` whose mode keeps the owner's read and write on every
file and access to every directory, such as `u+w`, `755`, or `go-rwx`, and a
`chown` to the user running the command.
'''

limits = '''
Nah cannot tell which project applies when it has not observed a project root.
`find -delete` without an explicit start path has no modeled target and
delegates. Nah takes the user running the command from `USER`, and reads a
`chown` owner only when it is written out or held in a variable, so
`chown -R $(whoami) .` blocks. `chgrp` always blocks.
'''

default_reason = '''
It ships on because losing the whole working tree is broad loss, and naming a
subtree is an easy alternative. `git-clean-force` and `git-worktree-discard`
protect the same tree against Git-driven discards, and `fs-home` and
`fs-system-tree` protect larger roots.
'''

[[blocks]]
row = "fs-project-root.delete-root"
why = ". is the project root itself."
tui = true

[[blocks]]
row = "fs-project-root.delete-root-glob"
why = "* selects every top-level entry of the project."
tui = true

[[blocks]]
row = "fs-project-root.chmod-destructive-mode"
why = "-R 000 removes every permission on the whole project tree."
tui = true

[[blocks]]
row = "fs-project-root.chmod-owner-write-removed-blocks"
why = "u-w makes every file and directory in the project read-only for its owner."

[[blocks]]
row = "fs-project-root.chown-other-user-blocks"
why = "The whole project is handed to root, so its owner can no longer change it."

[[blocks]]
row = "fs-project-root.find-dot-delete"
why = "find . -delete removes the project root and everything under it."

[[blocks]]
row = "fs-project-root.git-rm-bundled-rf-root"
why = "git rm -rf . deletes every tracked file from the working tree."

[[blocks]]
row = "fs-project-root.python-getcwd-rmtree"
why = "rmtree is given os.getcwd(), the project root."

[[blocks]]
row = "fs-project-root.find-type-file-exec-shred-overwrite-root"
why = "shred overwrites every regular file under the project root."

