summary = "Blocks reading or overwriting private keys and credential stores, printing GitHub CLI tokens, typing out credential values, and deleting or moving away private keys."

replaces = ["secrets-credentials"]

description = '''
This rule stops the agent from reading or overwriting private keys and
credential stores, and from deleting or moving away private keys and other
key material that cannot be reissued. It blocks reads that disclose the
contents of such a file, writes that replace one, staging one into Git with
`git add` or a commit (the message names the file to list in `.gitignore`),
reading one out of Git history, reading keychain items by name, and
`gh auth token`, `gh auth status --show-token` (`-t`), or
`gh auth git-credential get`.
Capturing or redirecting a token read still blocks, as it does for other
credential reads. It also blocks typing a credential out anywhere in a call:
in the command, in content it writes, or in any other tool argument, such as
a search pattern, a URL or an MCP tool's arguments. That is the value (16+
characters) of a credential variable in the hook's environment, one the
catalog lists or whose name ends in a secret word such as `_TOKEN`,
`_SECRET`, `_PASSWORD` or `_API_KEY` (but not a client-public framework
variable such as `VITE_` or `NEXT_PUBLIC_`, which ships to browsers), or a
token of a well-known format, even in such a variable,
wherever the agent saw it: GitHub, GitLab, Slack, Anthropic, OpenAI project,
Stripe live, npm, PyPI and Hugging Face tokens.

The protected files include SSH private keys (not `.pub` files), GnuPG key
material, `.netrc` and `.git-credentials`, `~/.aws/credentials` and the AWS
SSO cache, token files for gcloud, Azure, `gh`, `glab`, Docker, Kubernetes,
Cargo, RubyGems, Poetry, Terraform, and `~/.npmrc`, `/etc/shadow`,
`/etc/kubernetes/admin.conf`, and keychains.
'''

limits = '''
Nah cannot tell whether the user asked for a key to be inspected. It cannot
recognize credentials stored at unlisted paths, and a path it cannot identify
delegates. Files that merely look like keys, such as `.pem` and `.key` files,
can be read; only sending them over the network blocks, through
`exfiltration/secret-upload`.

A typed-out credential is recognized only by its exact value in the hook's
environment or by a listed format. Formats ordinary text also takes, or that
are no secret, are left out: AWS access key IDs, Google API keys, JWTs,
Stripe test keys and private key blocks. Writing a test fixture that holds a
token of a listed format, or searching the project for a leaked token, also
blocks.
'''

applies_at = '''
It applies at core because raw credential exposure is exactly what a prompt
injection seeks. `secrets/env-files-read` covers `.env` files and credential
environment variables, `exfiltration/secret-upload` covers sending sensitive
files over the network, and `persistence/auth-files-modify` covers
`authorized_keys`.
'''

[[blocks]]
row = "secrets-credentials.ssh-read"
why = "~/.ssh/id_rsa is an SSH private key; cat prints it."
tui = true

[[blocks]]
row = "secrets-credentials.git-add-all-private-key"
why = "git add -A stages id_ed25519, an SSH private key Git does not ignore."

[[blocks]]
row = "secrets-credentials.aws-credentials-read"
why = "~/.aws/credentials holds AWS access keys."
tui = true

[[blocks]]
row = "secrets-credentials.shadow-read"
why = "/etc/shadow holds the system's password hashes."
tui = true

[[blocks]]
row = "secrets-credentials.symlink-alias-read"
why = "cat reads alias, which Nah follows back to the AWS credentials file."

[[blocks]]
row = "secrets-credentials.git-cat-file-history"
why = "The private key is read out of a commit instead of the working tree."

[[blocks]]
row = "secrets-credentials.gh-auth-token"
why = "gh auth token prints the stored authentication token."

[[blocks]]
row = "secrets-credentials.gh-auth-git-credential-get-input"
why = "The Git credential helper prints the stored GitHub token as the password."

[[blocks]]
row = "secrets-credentials.git-credentials-write"
why = "Redirecting into ~/.git-credentials replaces the stored Git tokens."

[[blocks]]
row = "secrets-credentials.retyped-value-credential-shaped-name-curl-header"
why = "The header types out the value of the hook environment's SLACK_BOT_TOKEN."

[[blocks]]
row = "secrets-credentials.delete-ssh-key"
why = "Deleting a private key loses it unless it is backed up elsewhere."

[[blocks]]
row = "secrets-credentials.move-source"
why = "Moving id_rsa to backup takes the private key out of ~/.ssh."

[[passes]]
row = "secrets-credentials.delete-ssh-public-key-delegates"
why = "A .pub file holds only the public half, which can be regenerated."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.move-key-to-key-name-delegates"
why = "id_rsa.bak keeps the key inside ~/.ssh under a key name."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.move-ssh-config-delegates"
why = "~/.ssh/config holds host settings, not key material."
cause = "out-of-scope"

[[passes]]
row = "secrets.gh-auth-status-delegates"
why = "Without --show-token, gh auth status does not print the raw token."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.retyped-sha256-digest-delegates"
why = "A hex digest has no token prefix and names no credential."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.public-named-value-delegates"
why = "NEXT_PUBLIC_MAPS_API_KEY is named public, so its value is no credential."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.keychain-lookup-metadata-delegates"
why = "Without -w, find-generic-password prints item metadata, not the secret."
cause = "out-of-scope"
