why = "printenv prints the value of AWS_SECRET_ACCESS_KEY."
tui = true

[[blocks]]
row = "secrets-env.credential-expansion"
why = "The shell expands $GITHUB_TOKEN into echo's output."
tui = true

[[blocks]]
row = "secrets.bare-printenv-delegates"
why = "The observed environment holds a credential, so bare printenv prints it."

[[blocks]]
row = "secrets-env.git-show"
why = "The .env file is read out of a commit instead of the working tree."

[[blocks]]
row = "secrets-env.git-commit-message-file"
why = "Git reads .env as the commit message and stores its bytes in the commit."

[[blocks]]
row = "secrets-env.git-observed-add-all"
why = "git add -A stages .env, which Git does not ignore."

[[blocks]]
row = "secrets-env.git-commit-all-tracked-env"
why = "commit -a stages the change to .env, which Git tracks."

