summary = "Blocks reads or writes of private-key and credential-store paths, and deleting or moving away private keys and other non-reissuable key material."

description = '''
This guard stops the agent from reading or overwriting private keys and
credential stores, and from deleting or moving away private keys and other
key material that cannot be reissued. It blocks reads that disclose the
contents of such a file, writes that replace one, reading one out of Git
history, and reading keychain items by name. The protected files include SSH
private keys (not `.pub` files), GnuPG key material, `.netrc` and
`.git-credentials`, `~/.aws/credentials` and the AWS SSO cache, token files
for gcloud, Azure, `gh`, `glab`, Docker, Kubernetes, Cargo, RubyGems, Poetry,
Terraform, and `~/.npmrc`, `/etc/shadow`, `/etc/kubernetes/admin.conf`, and
keychains.
'''

limits = '''
Nah cannot tell whether the user asked for a key to be inspected. It cannot
recognize credentials stored at unlisted paths, and a path it cannot identify
delegates. Files that merely look like keys, such as `.pem` and `.key` files,
can be read; only sending them over the network blocks, through
`secrets-exfil`.
'''

default_reason = '''
It ships on because raw credential exposure is exactly what a prompt injection
seeks, and the block reason says so. `secrets-env` covers `.env` files and
credential environment variables, `secrets-exfil` covers sending sensitive
files over the network, and `fs-auth-identity` covers `authorized_keys`.
'''

[[blocks]]
row = "secrets-credentials.ssh-read"
why = "~/.ssh/id_rsa is an SSH private key; cat prints it."
tui = true

[[blocks]]
row = "secrets-credentials.aws-credentials-read"
why = "~/.aws/credentials holds AWS access keys."
tui = true

[[blocks]]
row = "secrets-credentials.shadow-read"
why = "/etc/shadow holds the system's password hashes."
tui = true

[[blocks]]
row = "secrets-credentials.symlink-alias-read"
why = "cat reads alias, which Nah follows back to the AWS credentials file."

[[blocks]]
row = "secrets-credentials.git-cat-file-history"
why = "The private key is read out of a commit instead of the working tree."

[[blocks]]
row = "secrets-credentials.git-credentials-write"
why = "Redirecting into ~/.git-credentials replaces the stored Git tokens."

[[blocks]]
row = "secrets-credentials.delete-ssh-key"
why = "Deleting a private key loses it unless it is backed up elsewhere."

[[blocks]]
row = "secrets-credentials.move-source"
why = "Moving id_rsa to backup takes the private key out of ~/.ssh."

[[passes]]
row = "secrets-credentials.delete-ssh-public-key-delegates"
why = "A .pub file holds only the public half, which can be regenerated."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.move-key-to-key-name-delegates"
why = "id_rsa.bak keeps the key inside ~/.ssh under a key name."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.move-ssh-config-delegates"
why = "~/.ssh/config holds host settings, not key material."
cause = "out-of-scope"

[[passes]]
row = "secrets-credentials.keychain-lookup-metadata-delegates"
why = "Without -w, find-generic-password prints item metadata, not the secret."
cause = "out-of-scope"
