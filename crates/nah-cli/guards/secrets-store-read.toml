summary = "Blocks reviewed secret value reads through Vault, AWS Secrets Manager and decrypted SSM, Google Cloud Secret Manager, Azure Key Vault, Doppler, Infisical, and 1Password. Help, metadata and name-only output, run and inject workflows, dynamic command paths, malformed forms, and unknown output options stay outside."

description = '''
This guard stops the agent from pulling secret values out of a secret manager
into its own context. It blocks value reads through Vault, AWS Secrets Manager
and decrypted SSM parameters, Google Secret Manager, Azure Key Vault, Doppler,
Infisical, and 1Password. Reads that feed the value to another program count.
The managers' own injection workflows stay outside, and the block reason
recommends them.
'''

limits = '''
Nah cannot tell whether the user truly needs to see the value. Help and
metadata output, unresolved command paths, malformed forms, and unknown
output options delegate.
'''

default_reason = '''
It ships on because a value read into the transcript is exposure, and a
reviewed run or inject path exists for legitimate use. `secrets-exfil` blocks
sending a store value over the network even when this guard is off, and the
`secrets-store-delete` and `secrets-store-destroy` guards cover removal.
'''

[[blocks]]
row = "secrets-store-read.vault"
why = "kv get prints the secret's data."
tui = true

[[blocks]]
row = "secrets-store-read.onepassword"
why = "op read prints the password field's value."
tui = true

[[blocks]]
row = "secrets-store-read.aws"
why = "--with-decryption makes SSM return the plaintext value."
tui = true

[[blocks]]
row = "secrets-store-read.doppler"
why = "secrets get --plain prints API_TOKEN's raw value."

[[blocks]]
row = "secrets-store-read.onepassword-reveal"
why = "--reveal prints concealed fields in clear text."

[[passes]]
row = "secrets-store-read.doppler-run-app-delegates"
why = "doppler run injects secrets into npm start without printing them."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-read.op-inject-delegates"
why = "op inject writes values into the config file, not the transcript."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-read.doppler-only-names-delegates"
why = "--only-names lists secret names without values."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-read.aws-ssm-get-parameter-no-decryption-delegates"
why = "Without --with-decryption, SSM returns a SecureString still encrypted."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-read.az-keyvault-show-query-id-delegates"
why = "--query id prints only the secret's identifier."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-read.aws-secretsmanager-output-invalid-delegates"
why = "Nah cannot tell what the unknown output format garbage would print."
cause = "unresolved"
