summary = "Blocks proven permanent secret-store destruction: Vault kv destroy with explicit versions, kv metadata delete and secrets disable, and the same KV metadata delete or destroy with versions sent by generic vault delete/write or by curl with an X-Vault header or to $VAULT_ADDR; AWS Secrets Manager force deletion without recovery and SSM parameter deletion; Google whole-secret deletion; Azure Key Vault object and vault purge; Doppler project, environment, and configuration deletion; 1Password vault deletion. Remote permissions or purge protection may reject the attempt. Help, non-executing forms, dynamic targets, invalid or unknown syntax, KMS, and other REST calls stay outside."

description = '''
This guard stops permanent destruction of secret-manager data or of its
recovery path. It covers Vault `kv destroy`, `kv metadata delete`, and
`secrets disable`, and the same KV requests sent by `vault delete`/`vault
write` or by curl with an `X-Vault-*` header or to `$VAULT_ADDR`; AWS Secrets
Manager deletion without recovery and SSM parameter deletion; Google Secret
Manager whole-secret deletion; Azure Key Vault purge; Doppler project,
environment, and configuration deletion; and 1Password vault deletion.
Google secret version destruction belongs to `secrets-store-delete`.
'''

limits = '''
Nah cannot see purge protection or access rules that would reject the
attempt. KMS keys, other REST calls, unresolved targets, and unknown
syntax are outside this guard, and an unknown deletion mode delegates with a
coverage gap.
'''

default_reason = '''
It ships on because losing both a secret and its recovery path is permanent.
It is independent of the optional `secrets-store-delete`, so an existing
override of that guard does not switch this one off. `secrets-store-read`
covers reading values.
'''

[[blocks]]
row = "secrets-store-destroy.vault-destroy"
why = "kv destroy permanently erases version 2; undelete cannot bring it back."
tui = true

[[blocks]]
row = "secrets-store-destroy.aws-force-delete"
why = "--force-delete-without-recovery skips the recovery window."
tui = true

[[blocks]]
row = "secrets-store-destroy.azure-purge"
why = "purge removes a soft-deleted secret for good."
tui = true

[[blocks]]
row = "secrets-store-destroy.metadata"
why = "metadata delete erases every version of secret/api and its history."

[[blocks]]
row = "secrets-store-destroy.ssm"
why = "SSM parameters have no recovery window; deletion is immediate."

[[blocks]]
row = "secrets-store-destroy.gcloud"
why = "Deleting the whole secret destroys all of its versions."

[[blocks]]
row = "secrets-store-delete.onepassword-vault"
why = "Deleting a 1Password vault deletes every item in it."

[[passes]]
row = "secrets-store-destroy.negated"
why = "The later --no-force-delete-without-recovery wins, so the recovery window applies."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-destroy.conflict"
why = "The force flag and a recovery window conflict, so Nah cannot tell which deletion mode applies."
cause = "unresolved"

[[passes]]
row = "secrets-store-destroy.delayed-version"
why = "Version destruction belongs to secrets-store-delete, which this context leaves off."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-destroy.vault-kv-undelete-delegates"
why = "undelete restores versions instead of removing them."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-destroy.vault-generic-destroy-without-data-delegates"
why = "No version list is sent, so the destroy request names nothing to erase."
cause = "out-of-scope"
