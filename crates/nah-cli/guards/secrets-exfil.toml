summary = "Blocks a visible flow from a sensitive source to a network stage."

description = '''
This guard stops sensitive data from being sent over the network. It blocks
when an upload in the same command carries data from a credential or `.env`
file, another sensitive file such as a `.pem` or `.key`, a secret-manager
value, a printed credential variable, or the whole environment. A recursive
search of the project, home, or system for credential patterns such as `AKIA`
or `ghp_` also counts as a source. Uploads to your own bucket, gist, or
release count too.
'''

limits = '''
Nah cannot resolve endpoints or files in unresolved variables, or files
inside a directory it could not scan. A route it cannot connect from the
sensitive source to the upload delegates.
'''

default_reason = '''
It ships on because a secret sent off the machine cannot be recalled, and
clean uploads are not interrupted. `secrets-env` and `secrets-credentials`
block the local read of their files, so a flow from those files often matches
both. `.pem`, `.key`, and similar files are blocked only here.
'''

[[blocks]]
row = "secrets-exfil.network-cat-env-curl-data-binary-evil-example"
why = "curl uploads its stdin, which is the contents of .env."
tui = true

[[blocks]]
row = "exec.exfil-environment-disclosure"
why = "env prints the whole environment, and curl uploads it."
tui = true

[[blocks]]
row = "secrets-exfil.printenv-aws-secret-access-key-curl-d-https-evil-example"
why = "The AWS secret key is printed and piped into curl -d @-."
tui = true

[[blocks]]
row = "exec.exfil-credential-search-mail"
why = "A recursive grep for AKIA over the home directory collects AWS keys, and mail sends them."

[[blocks]]
row = "exec.scp-exfil-upload"
why = "scp copies the AWS credentials file to another host."

[[blocks]]
row = "secrets-exfil.descendants-tar-cf-certs-curl-data-binary-evil-example"
why = "certs holds a private key, so the archive curl uploads carries it."

[[passes]]
row = "exec.live-printenv-path-curl-d-https-evil-example"
why = "PATH is not a credential variable."
cause = "out-of-scope"

[[passes]]
row = "exec.nonrecursive-credential-search-delegates"
why = "A grep of one script for AKIA does not search for stored credentials."
cause = "out-of-scope"

[[passes]]
row = "exec.clean-directory-to-ssh-delegates"
why = "src holds no sensitive file, so the upload is clean."
cause = "out-of-scope"

[[passes]]
row = "secrets-exfil.aws-secretsmanager-name-upload-delegates"
why = "--query Name prints the secret's name, not its value."
cause = "out-of-scope"

[[passes]]
row = "secrets-exfil.scp-source-server-key-mktemp-d-server-key"
why = "The key is copied into a local temporary directory, not over the network."
cause = "out-of-scope"

[[passes]]
row = "secrets-exfil.scp-get-source-evil-example-tmp-server-key"
why = "Nah cannot run get_source to learn which file scp uploads."
cause = "unresolved"
