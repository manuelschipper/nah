summary = "Blocks resetting a Podman runtime's entire local state: every container, image, volume, and network at once."

replaces = ["infra-container-reset", "infra-container-volume-delete"]

strict_adds = "At strict, it also blocks pruning unused volumes and Compose teardown that removes named volumes."

description = '''
This rule stops a command that wipes a Podman runtime's entire local state:
every container, image, volume, network, and build cache at once. It blocks
`podman system reset` and `podman machine reset` when they would actually run,
whether forced or confirmed through piped input.

At strict, it also stops container commands that delete data volumes. It
blocks broad pruning of unused volumes and Compose teardown that removes a
project's named volumes, which can hold a local database, through Docker,
Podman, and Compose.
'''

limits = '''
Nah cannot tell a disposable CI machine from a workstation with valuable
volumes, or whether a volume holds throwaway test data or the only copy of a
development database. Podman's default prune scope depends on its version.
When a control Nah needs is missing or unresolved, the call delegates with a
coverage gap.
'''

applies_at = '''
A full reset applies at core because it destroys every volume without
selecting any, and routine cleanup has narrower prune commands. Volume
deletes apply only at strict because `docker compose down -v` is a routine
reset of disposable development stacks.
'''

[[blocks]]
row = "infra-container-reset.podman-system-reset"
why = "system reset deletes every container, image, and volume after a prompt."
tui = true

[[blocks]]
row = "infra-container-reset.force"
why = "--force runs the full reset without asking."
tui = true

[[blocks]]
row = "infra-container-reset.confirmation-pipe"
why = "The piped y answers the confirmation prompt."

[[blocks]]
row = "infra-container-reset.machine-control"
why = "machine reset --force removes every Podman machine and its data."

[[blocks]]
row = "infra-container-reset.infrastructure-podman-system-reset-force-false"
why = "--force=false still leaves the prompt, which an agent can answer."

[[blocks]]
row = "infra-container-reset.variable-program"
why = "$P resolves to podman in the same call."

[[blocks]]
row = "infra-container-volume-delete.docker-volume-all"
why = "--all prunes every unused volume, named ones included."
tui = true
strict = true

[[blocks]]
row = "infra-container-volume-delete.docker-compose-down"
why = "-v removes the stack's named volumes along with its containers."
tui = true
strict = true

[[blocks]]
row = "infra-container-volume-delete.infrastructure-podman-compose-rm-worker-volumes"
why = "--volumes deletes the worker service's volumes."
tui = true
strict = true

[[blocks]]
row = "infra-container-volume-delete.docker-system-volumes"
why = "--volumes adds every unused volume to the system prune."
strict = true

[[blocks]]
row = "infra-container-volume-delete.narrow-volume-delegates"
why = "podman volume prune --force removes unused volumes without asking."
strict = true

[[blocks]]
row = "infra-container-volume-delete.remote-daemon"
why = "The prune runs against a remote daemon's volumes; it still deletes them."
strict = true

[[passes]]
row = "infra-container-reset.help-delegates"
why = "--help prints usage and resets nothing."
cause = "out-of-scope"

[[passes]]
row = "infra-container-reset.remote-connection"
why = "--connection production targets a remote service, not the local runtime."
cause = "out-of-scope"

[[passes]]
row = "infra-container-reset.system-prune-delegates"
why = "system prune removes only unused data, not the whole state."
cause = "out-of-scope"

[[passes]]
row = "infra-container-reset.root-terminator-delegates"
why = "Podman rejects a -- before the subcommand, so nothing runs."
cause = "out-of-scope"

[[passes]]
row = "infra-container-reset.machine-stop-delegates"
why = "machine stop shuts the VM down but keeps its data."
cause = "out-of-scope"

[[passes]]
row = "infra-container-reset.path-override-delegates"
why = "PATH=/tmp resolves podman from /tmp, so Nah cannot establish which program runs."
cause = "unresolved"

[[passes]]
row = "infra-container-volume-delete.compose-down-without-volumes-delegates"
why = "Without -v, compose down keeps the volumes."
cause = "out-of-scope"

[[passes]]
row = "infra-container-volume-delete.narrow-system-delegates"
why = "Without --volumes, system prune keeps volumes."
cause = "out-of-scope"

[[passes]]
row = "infra-container-volume-delete.named-volume-control"
why = "volume rm deletes one named volume, not a broad prune."
cause = "out-of-scope"

[[passes]]
row = "infra-container-volume-delete.filter-delegates"
why = "--filter label=temporary narrows the prune to labeled volumes."
cause = "out-of-scope"

[[passes]]
row = "infra-container-volume-delete.dry-run-delegates"
why = "--dry-run only lists what would be pruned."
cause = "out-of-scope"

[[passes]]
row = "infra-container-volume-delete.dynamic-scope-delegates"
why = "$SCOPE is unset, so the prune's scope is unknown."
cause = "unresolved"
