summary = "Blocks permanently destroying secrets in a secret manager, or their recovery path."

replaces = ["secrets-store-delete", "secrets-store-destroy"]

strict_adds = "At strict, it also blocks deleting a secret that can still be recovered, or whose recovery depends on remote settings."

description = '''
This rule stops permanent destruction of secret-manager data or of its
recovery path. It covers Vault `kv destroy` with explicit versions,
`kv metadata delete`, and `secrets disable`, and the same KV requests sent by
`vault delete` or `vault write`, or by curl with an `X-Vault-*` header or to
`$VAULT_ADDR`; AWS Secrets Manager deletion without recovery and SSM
parameter deletion; Google Secret Manager whole-secret deletion; Azure Key
Vault object and vault purge; Doppler project, environment, and configuration
deletion; and 1Password vault deletion.

At strict, it also stops deletion when the secret can still be recovered, or
when recovery depends on remote settings. It covers Vault `kv delete`, AWS
Secrets Manager deletion with a recovery window, Azure Key Vault object and
vault deletion, Google secret version destruction, Doppler secret deletion,
Infisical secret and folder deletion, and 1Password item and document
deletion.

Archiving, `run` and `inject` workflows, help, other forms that do not run,
unresolved targets, and unknown syntax stay outside, and so do KMS keys and
other REST calls.
'''

limits = '''
Nah cannot see purge protection or access rules that would reject the
attempt, or the remote recovery window or soft-delete setting. A request
whose deletion mode Nah cannot tell delegates with a coverage gap.
'''

applies_at = '''
Permanent destruction applies at core because losing both a secret and its
recovery path cannot be undone. Deleting a secret that can be recovered
applies only at strict because it is routine rotation work.
`secrets/vault-secrets-read` covers reading values.
'''

[[blocks]]
row = "secrets-store-destroy.vault-destroy"
why = "kv destroy permanently erases version 2; undelete cannot bring it back."
tui = true

[[blocks]]
row = "secrets-store-destroy.aws-force-delete"
why = "--force-delete-without-recovery skips the recovery window."
tui = true

[[blocks]]
row = "secrets-store-destroy.azure-purge"
why = "purge removes a soft-deleted secret for good."
tui = true

[[blocks]]
row = "secrets-store-destroy.metadata"
why = "metadata delete erases every version of secret/api and its history."

[[blocks]]
row = "secrets-store-destroy.ssm"
why = "SSM parameters have no recovery window; deletion is immediate."

[[blocks]]
row = "secrets-store-destroy.gcloud"
why = "Deleting the whole secret destroys all of its versions."

[[blocks]]
row = "secrets-store-delete.onepassword-vault"
why = "Deleting a 1Password vault deletes every item in it."

[[blocks]]
row = "secrets-store-delete.vault-soft-delete"
why = "kv delete removes the latest version of service/api; it stays undeletable only until destroyed."
tui = true
strict = true

[[blocks]]
row = "secrets-store-delete.aws-recovery-window"
why = "The secret is scheduled for deletion and is gone after the 14-day window."
tui = true
strict = true

[[blocks]]
row = "secrets-store-delete.op-item-delete-item-id-vault-prod"
why = "Without --archive, op item delete removes the item from the prod vault."
tui = true
strict = true

[[blocks]]
row = "secrets-store-delete.az-keyvault-secret-delete-vault-name-prod-name-service-api"
why = "Recovery depends on the vault's soft-delete setting, which Nah cannot see."
strict = true

[[blocks]]
row = "secrets-store-delete.doppler-secrets-delete-api-token-database-url-project-service-config"
why = "Both named secrets are deleted from the prod configuration."
strict = true

[[passes]]
row = "secrets-store-destroy.negated"
why = "The later --no-force-delete-without-recovery wins, so the recovery window applies; the rule blocks recoverable deletion only at strict."
cause = "strict-only"

[[passes]]
row = "secrets-store-destroy.conflict"
why = "The force flag and a recovery window conflict, so Nah cannot tell which deletion mode applies."
cause = "unresolved"

[[passes]]
row = "secrets-store-destroy.delayed-version"
why = "Destroying one version leaves the secret and its other versions; the rule blocks it only at strict."
cause = "strict-only"

[[passes]]
row = "secrets-store-destroy.vault-kv-undelete-delegates"
why = "undelete restores versions instead of removing them."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-destroy.vault-generic-destroy-without-data-delegates"
why = "No version list is sent, so the destroy request names nothing to erase."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.onepassword-archive-delegates"
why = "--archive moves the item to the archive, where it can be restored."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.gcloud-version-disable-delegates"
why = "Disabling a version keeps its value and can be undone."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.aws-restore-secret-delegates"
why = "restore-secret cancels a scheduled deletion."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.vault-delete-help-delegates"
why = "-help prints usage and deletes nothing."
cause = "out-of-scope"

[[passes]]
row = "secrets-store-delete.aws-describe-delegates"
why = "describe-secret reads metadata only."
cause = "out-of-scope"
