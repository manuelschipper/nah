summary = "Blocks deleting a whole backup repository, or every backup a tool manages."

replaces = ["storage-backup-destroy", "storage-recursive-delete"]

strict_adds = "At strict, it also blocks bulk deletes of remote storage and syncs that delete at the destination."

description = '''
This rule stops the agent from deleting a whole backup repository, or every
backup a tool manages. That removes the recovery set every other mistake
relies on. It blocks deleting a complete Borg repository, Restic's explicit
remove-all option, wildcard selection of every Borg archive, every Kopia
snapshot for a source with deletion confirmed, and deleting every Velero
backup.

At strict, it also stops bulk deletion of remote storage, and synchronization
that deletes whatever the destination has and the source lacks. It blocks
recursive object-store deletion, bucket and container removal with contents,
cloud storage account deletion, and sync commands with delete options. A
local `rsync --delete` destination counts too. Single objects, copies,
empty-bucket removal, and dry runs stay outside. Deleting a snapshot, a
backup archive, or a retention run is `infrastructure/snapshot-delete`.
'''

limits = '''
Nah cannot see whether other copies of the backups exist. It cannot tell
whether a bucket being torn down holds backups, and removing an empty bucket
or directory is outside this rule. `restic prune`, Borg compact, and Kopia
maintenance collect unreferenced data rather than deleting the backup set.

Nah cannot tell a deploy mirror, where deleting stale files is the point, from
a data bucket. It cannot read delete manifests or lifecycle JSON.
`rsync --delete --backup-dir`, `zfs receive -F`, and `az storage blob sync`
delegate because their arguments do not prove data loss at the destination,
and MinIO's `mc rm --recursive` is not yet modeled.

Google Cloud and Azure database, instance, and server deletion are outside
this rule. What survives them depends on the service and its configuration:
Cloud SQL keeps backups for a while after an instance is deleted, Spanner
refuses to delete an instance that still has backups, and deleting an Azure
SQL database keeps its point-in-time backups while deleting its server does
not, leaving only long-term-retention backups where they were configured. An
action, target kind, or mode Nah cannot resolve delegates with a coverage gap.
'''

applies_at = '''
Deleting a whole backup set applies at core because removing the recovery set
makes every other loss permanent. Bulk storage deletes apply only at strict
because sync-with-delete is the standard static-site deploy. Snapshot
deletes are `infrastructure/snapshot-delete`, so turning retention on does
not also turn on a recursive bucket delete.
'''

[[blocks]]
row = "storage-backup-destroy.borg-factory-default"
why = "With no ::archive suffix, borg delete removes the whole repository."
tui = true

[[blocks]]
row = "storage-backup-destroy.restic-forget-unsafe-allow-remove-all-tag-old"
why = "--unsafe-allow-remove-all lets forget remove every snapshot tagged old."
tui = true

[[blocks]]
row = "storage-backup-destroy.velero-backup-delete-all-confirm"
why = "--all deletes every Velero backup, and --confirm skips the prompt."
tui = true

[[blocks]]
row = "storage-backup-destroy.borg-repo-delete-force"
why = "repo-delete removes the Borg repository; --force skips its checks."

[[blocks]]
row = "storage-backup-destroy.confirmation-pipe"
why = "The piped y answers repo-delete's confirmation prompt."

[[blocks]]
row = "storage-backup-destroy.scope-borg-all-archives"
why = "The wildcard selects every archive, removing the complete recovery set."

[[blocks]]
row = "storage-backup-destroy.scope-kopia-all-source"
why = "--all-snapshots-for-source deletes the source's complete recovery history."

[[blocks]]
row = "storage-recursive.aws-s3-rm-s3-bucket-prefix-recursive-quiet"
why = "--recursive deletes every object under the prefix."
tui = true
strict = true

[[blocks]]
row = "storage-recursive.rclone-purge"
why = "purge deletes the remote path and everything under it."
tui = true
strict = true

[[blocks]]
row = "storage-recursive.rclone-sync-remote-mirror"
why = "sync deletes destination files missing from the source."
strict = true

[[blocks]]
row = "storage-recursive.rsync-a-delete-dist-host-var-www"
why = "--delete removes files on the host that dist/ lacks."
tui = true
strict = true

[[blocks]]
row = "storage-recursive.aws-bucket-force"
why = "--force deletes every object before removing the bucket."
strict = true

[[blocks]]
row = "storage-recursive.azure-account"
why = "Deleting the storage account deletes all of its containers and data."
strict = true

[[passes]]
row = "storage-boundary.restic-prune-delegates"
why = "prune drops only data no remaining snapshot references."
cause = "out-of-scope"

[[passes]]
row = "storage-backup-destroy.borg-compact-delegates"
why = "compact frees space from already-deleted archives."
cause = "out-of-scope"

[[passes]]
row = "storage-backup-destroy.borg-list-archives-delegates"
why = "borg list only lists the archives."
cause = "out-of-scope"

[[passes]]
row = "storage-backup-destroy.restic-prune-dry-run-delegates"
why = "--dry-run reports what prune would remove."
cause = "out-of-scope"

[[passes]]
row = "storage-backup-destroy.borg-repo-delete"
why = "--yes is not an option Nah recognizes, so it cannot tell how borg parses the command."
cause = "unresolved"

[[passes]]
row = "storage-backup-destroy.scope-restic-daily-delegates"
why = "--keep-daily 7 expires snapshots, which is infrastructure/snapshot-delete, not this rule's whole backup set."
cause = "out-of-scope"

[[passes]]
row = "storage-boundary.single-object-delegates"
why = "One named object is deleted, not a prefix."
cause = "out-of-scope"

[[passes]]
row = "storage-boundary.empty-aws-bucket-delegates"
why = "Without --force, rb only removes an empty bucket."
cause = "out-of-scope"

[[passes]]
row = "storage-boundary.rclone-copy-delegates"
why = "copy adds and overwrites files but never deletes at the destination."
cause = "out-of-scope"

[[passes]]
row = "storage-boundary.rclone-dry-run-delegates"
why = "--dry-run reports what sync would delete without deleting."
cause = "out-of-scope"

[[passes]]
row = "storage-boundary.opaque-delete-manifest-delegates"
why = "Nah cannot read which keys objects.json lists."
cause = "unresolved"

[[passes]]
row = "storage-boundary.duplicity-without-force-delegates"
why = "Without --force, duplicity only lists what it would remove."
cause = "out-of-scope"
