summary = "Blocks statically targeted GitHub, GitLab, and Azure DevOps hosted-resource deletion through reviewed CLI commands and REST routes."

description = '''
This guard stops the agent from deleting resources hosted on GitHub, GitLab,
or Azure DevOps, such as releases and their assets, secrets, variables, deploy
keys, SSH and GPG keys, gists, caches, webhooks, branch protection rules,
pipelines, and permanently destroyed work items. It blocks reviewed `gh`,
`glab`, and `az` delete commands and `DELETE` requests to those resource
routes. The target must be known; one in an unresolved variable does not
match.
'''

limits = '''
Nah cannot tell whether a release or secret is still in use.
'''

default_reason = '''
It ships off because rotating secrets, clearing caches, and pruning releases
are routine CI maintenance. The default-on `git-remote-repo-delete` covers
whole-repository deletion, and the `secrets-store-*` guards cover secret
managers outside GitHub and GitLab.
'''

