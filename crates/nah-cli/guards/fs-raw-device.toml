summary = "Blocks visible writes to, and whole-device destruction of, raw storage devices, and the sysrq trigger."

description = '''
This guard prevents writes that bypass the filesystem and destroy a disk,
partition, or kernel state directly. It blocks writes to raw storage devices
such as `/dev/sd*`, `/dev/nvme*`, `/dev/mmcblk*`, `/dev/loop*`, device-mapper
and `/dev/disk/` paths, `/dev/mem`, and Windows `\\.\PhysicalDriveN`, plus the
`/proc/sysrq-trigger` crash trigger. It also blocks whole-device destruction
tools such as `mkfs`, `sfdisk --delete`, `pvremove`, `cryptsetup luksFormat`,
`cryptsetup erase`, and `badblocks -w` when they target a device.
'''

limits = '''
Nah recognizes devices by how the path is spelled, so it cannot see through a
udev alias or symlink it did not observe.
'''

default_reason = '''
It ships on because losing a whole device is unrecoverable, and development
work rarely writes raw devices. `fs-volume-destroy` covers logical volumes,
pools, and datasets, and `storage-snapshot-delete` covers snapshots.
'''

[[blocks]]
row = "fs-raw-device.dd"
why = "of=/dev/sda overwrites the whole disk with zeros."
tui = true

[[blocks]]
row = "fs-raw-device.sysrq"
why = "Writing b to /proc/sysrq-trigger reboots the kernel immediately."
tui = true

[[blocks]]
row = "fs-raw-device.loop-device"
why = "mkfs.ext4 formats the loop device, destroying its contents."
tui = true

[[blocks]]
row = "fs-raw-device.wipefs-all-erase"
why = "--all erases every filesystem signature on the disk."

[[blocks]]
row = "fs-raw-device.sudo-dd-flash-usb"
why = "dd writes the image over the whole /dev/sdb device."

[[blocks]]
row = "fs-raw-device.sfdisk-script-rewrites-table"
why = "The piped script makes sfdisk write a new partition table."

[[blocks]]
row = "fs-raw-device.hdparm-security-erase-pass-dev-sda"
why = "--security-erase tells the drive firmware to erase all data."

[[passes]]
row = "fs-raw-device.inspect-delegates"
why = "Without erase options, wipefs only lists signatures."
cause = "out-of-scope"

[[passes]]
row = "fs-raw-device.mkfs-no-act-delegates"
why = "-n shows what mkfs would do without writing."
cause = "out-of-scope"

[[passes]]
row = "fs-raw-device.dd-read-mbr-delegates"
