[package]
name = "nah-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
getrandom = "0.4"
hmac = "0.12"
nah-proto = { path = "../nah-proto" }
nah-parse = { path = "../nah-parse" }
nah-actions = { path = "../nah-actions" }
nah-observe = { path = "../nah-observe" }
nah-policy = { path = "../nah-policy" }
nah-extensions = { path = "../nah-extensions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(all(unix, not(target_os = "redox")))'.dependencies]
rustix = { version = "1", features = ["fs"] }

# the TUI's terminal backend has no wasm target; the homepage demo compiles
# this crate to wasm32 for the browser "try it" pipeline
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[[bin]]
name = "nah"
path = "src/main.rs"
