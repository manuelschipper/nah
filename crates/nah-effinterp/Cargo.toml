[package]
name = "nah-effinterp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
effinterp-engine = { path = "../effinterp-engine" }
effinterp-matcher = { path = "../effinterp-matcher" }
effinterp-proto = { path = "../effinterp-proto" }
effinterp-trace = { path = "../effinterp-trace" }
nah-observe = { path = "../nah-observe" }
nah-proto = { path = "../nah-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Bridge tests compose the shipped guards as the pipeline does; production
# code never depends on policy.
[dev-dependencies]
nah-policy = { path = "../nah-policy" }
tempfile = "3"

[build-dependencies]
blake3 = "1"
